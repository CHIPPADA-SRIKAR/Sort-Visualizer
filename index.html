<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sort Visualizer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="app-body">
    <div class="container py-4">
      <header class="app-header text-center mb-4">
        <h1>Sort Visualizer</h1>
        <p class="lead">
          Choose an algorithm and watch the array sort step by step.
        </p>
      </header>
      <section class="controls card card-dark mb-4 p-4 shadow-sm">
        <div class="row gx-4 gy-4 align-items-center justify-content-between">
          <div class="col-12 col-md-3">
            <label class="form-label text-muted mb-2" for="algo-select"
              >Algorithm</label
            >
            <select id="algo-select" class="form-select form-select-dark">
              <option value="Selection Sort">Selection Sort</option>
              <option value="Bubble Sort">Bubble Sort</option>
              <option value="Insertion Sort">Insertion Sort</option>
              <option value="Quick Sort">Quick Sort</option>
              <option value="Merge Sort">Merge Sort</option>
              <option value="Radix Sort">Radix Sort</option>
              <option value="Heap Sort">Heap Sort</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label text-muted mb-2" for="arr_sz"
              >Array Size</label
            >
            <div class="range-group">
              <input
                id="arr_sz"
                type="range"
                min="5"
                max="60"
                step="1"
                value="30"
              />
            </div>
            <div class="range-value-row">
              <span id="size-value" class="range-value">30</span>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label text-muted mb-2" for="speed_input"
              >Speed</label
            >
            <div class="range-group">
              <input
                id="speed_input"
                type="range"
                min="20"
                max="300"
                step="10"
                value="200"
              />
            </div>
            <div class="range-value-row">
              <span id="speed-value" class="range-value">200</span>
            </div>
          </div>
          <div
            class="col-12 col-md-3 d-flex flex-wrap gap-3 justify-content-center justify-content-md-end"
          >
            <button
              id="generate-btn"
              type="button"
              class="btn btn-gradient btn-lg"
            >
              Generate Array
            </button>
            <button id="start-btn" type="button" class="btn btn-success btn-lg">
              Start Sorting
            </button>
            <button id="stop-btn" type="button" class="btn btn-danger btn-lg">
              Stop
            </button>
          </div>
        </div>
        <div class="stats-row mt-4 p-3 rounded-3 shadow-sm">
          <div class="stat-card">
            <div class="stat-label">Comparisons</div>
            <div id="comparison-count" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Array Accesses</div>
            <div id="access-count" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Time Complexity</div>
            <div id="time-complexity" class="stat-value">O(n)</div>
          </div>
        </div>
      </section>
      <section class="visualizer card p-3 shadow-sm mb-3">
        <div id="bars" class="flex-container"></div>
      </section>
      <section class="info text-center text-muted"></section>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
      crossorigin="anonymous"
    ></script>
    <script src="JavaScript_files/sorting.js"></script>
    <script src="JavaScript_files/bubble_sort.js"></script>
    <script src="JavaScript_files/insertion_sort.js"></script>
    <script src="JavaScript_files/merge_sort.js"></script>
    <script src="JavaScript_files/quick_sort.js"></script>
    <script src="JavaScript_files/radix_sort.js"></script>
    <script src="JavaScript_files/heap_sort.js"></script>
    <script src="JavaScript_files/selection_sort.js"></script>
  </body>
</html>
